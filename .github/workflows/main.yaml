name: Dev Pipeline
on:
  push:
    branches:
      - staging
jobs:
  static-scan:
    runs-on: ubuntu-latest
    env:
      JSON_OUTPUT: snyk-static-scan.json
    steps:
      - uses: actions/checkout@master
      - uses: snyk/actions/setup@master
      - name: Run Snyk to check for vulnerabilities
        continue-on-error: true
        run: |
          npm install -g snyk-to-html
          snyk code test || true
          snyk-to-html -i $JSON_OUTPUT -o snyk.html
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Archive snyk results
        uses: actions/upload-artifact@v4
        with:
          name: snyk-static-report
          path: snyk.html
          retention-days: 5
  dependency-scan:
    runs-on: ubuntu-latest
    env:
      JSON_OUTPUT: snyk-dependency-scan.json
    steps:
      - uses: actions/checkout@master
      - uses: snyk/actions/setup@master
      - name: Run Snyk to check for vulnerabilities
        continue-on-error: true
        run: |
          npm install -g snyk-to-html
          snyk test || true
          snyk-to-html -i $JSON_OUTPUT -o snyk.html
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Archive snyk results
        uses: actions/upload-artifact@v4
        with:
          name: snyk-dependency-report
          path: snyk.html
          retention-days: 5
  lint:
    needs: [static-scan, dependency-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: npm i --legacy-peer-deps
      - name: lint
        continue-on-error: true
        run: npm run lint
  integration-test:
    needs: [static-scan, dependency-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # ubuntu-latest ships a running Docker daemon, so Testcontainers can boot
      # the real MongoDB image the integration suite tests against.
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Run integration tests
        run: npm run test:integration
  # Staging verifies only: scans, lint, integration tests and a production
  # build. It does not release and it does not deploy. Releases and deploys are
  # owned by master (release-please -> v* tag -> release-publish.yml -> Fly.io).
  build:
    needs: [static-scan, dependency-scan, lint, integration-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'
      # Install from the lockfile — do NOT delete it. react-scripts@4.0.3 pins
      # @babel/core to 7.12.3 while floating babel-preset-react-app to ^10.0.0,
      # which resolves to 10.1.0 and requires ^7.16.0. Resolving without the
      # lockfile lets those land in an arrangement where the preset loads under
      # 7.12.3 and the build dies with:
      #   Requires Babel "^7.16.0", but was loaded with "7.12.3"
      # The committed lockfile pins a tree that builds; npm ci reproduces it.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build project
        run: npm run build
        env:
          SKIP_PREFLIGHT_CHECK: "true"
