<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img"
     aria-label="AI Quiz architecture: the React component posts to a proxy you host, which holds the provider API key">
  <title>AI Quiz — the key never reaches the browser</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6470"/>
    </marker>
  </defs>

  <rect width="1200" height="660" fill="#f7f8fa"/>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="600" y="62" text-anchor="middle" font-size="27" font-weight="700" fill="#161b22">
      The browser never holds the key
    </text>
    <text x="600" y="96" text-anchor="middle" font-size="17" fill="#5b6470">
      v2 removed the apiKey prop. The component talks to a proxy you host.
    </text>

    <!-- Browser -->
    <rect x="60" y="180" width="300" height="220" rx="16" fill="#ffffff" stroke="#d8dde3" stroke-width="1.5"/>
    <rect x="60" y="180" width="300" height="52" rx="16" fill="url(#accent)"/>
    <rect x="60" y="216" width="300" height="16" fill="url(#accent)"/>
    <text x="210" y="213" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1.4">BROWSER</text>
    <text x="210" y="278" text-anchor="middle" font-size="19" font-weight="600" fill="#161b22">Your React app</text>
    <text x="210" y="314" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#7c3aed">&lt;QuizComponent /&gt;</text>
    <text x="210" y="360" text-anchor="middle" font-size="15" fill="#16a34a" font-weight="600">✓ no secret shipped</text>

    <!-- Proxy -->
    <rect x="450" y="180" width="300" height="220" rx="16" fill="#ffffff" stroke="#d8dde3" stroke-width="1.5"/>
    <rect x="450" y="180" width="300" height="52" rx="16" fill="url(#accent)"/>
    <rect x="450" y="216" width="300" height="16" fill="url(#accent)"/>
    <text x="600" y="213" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1.4">YOUR SERVER</text>
    <text x="600" y="278" text-anchor="middle" font-size="19" font-weight="600" fill="#161b22">Proxy endpoint</text>
    <text x="600" y="314" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#2563eb">POST /api/quiz</text>
    <text x="600" y="360" text-anchor="middle" font-size="15" fill="#b45309" font-weight="600">🔑 OPENAI_API_KEY lives here</text>

    <!-- Provider -->
    <rect x="840" y="180" width="300" height="220" rx="16" fill="#ffffff" stroke="#d8dde3" stroke-width="1.5"/>
    <rect x="840" y="180" width="300" height="52" rx="16" fill="#161b22"/>
    <rect x="840" y="216" width="300" height="16" fill="#161b22"/>
    <text x="990" y="213" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1.4">PROVIDER</text>
    <text x="990" y="278" text-anchor="middle" font-size="19" font-weight="600" fill="#161b22">Any model backend</text>
    <text x="990" y="312" text-anchor="middle" font-size="15" fill="#5b6470">OpenAI · Anthropic</text>
    <text x="990" y="338" text-anchor="middle" font-size="15" fill="#5b6470">local model · a cache</text>
    <text x="990" y="372" text-anchor="middle" font-size="15" fill="#5b6470" font-weight="600">provider-agnostic</text>

    <!-- Arrows -->
    <line x1="368" y1="290" x2="440" y2="290" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="758" y1="290" x2="830" y2="290" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Contract -->
    <rect x="150" y="470" width="420" height="130" rx="12" fill="#ffffff" stroke="#d8dde3" stroke-width="1.5"/>
    <text x="170" y="500" font-size="13" font-weight="700" fill="#5b6470" letter-spacing="1.2">REQUEST</text>
    <text x="170" y="532" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#161b22">{ system, user, model,</text>
    <text x="170" y="558" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#161b22">  temperature }</text>

    <rect x="630" y="470" width="420" height="130" rx="12" fill="#ffffff" stroke="#d8dde3" stroke-width="1.5"/>
    <text x="650" y="500" font-size="13" font-weight="700" fill="#5b6470" letter-spacing="1.2">RESPONSE</text>
    <text x="650" y="532" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#161b22">{ content: "&lt;raw model</text>
    <text x="650" y="558" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#161b22">  output as a string&gt;" }</text>
  </g>
</svg>
